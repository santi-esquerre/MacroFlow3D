name: CI

# GPU-free harness checks only; CUDA builds/tests run on the V100 host.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hooks/check-lester-increments.sh
      - run: bash scripts/hooks/check-required-docs.sh
      - run: bash scripts/hooks/validate-cmake-presets.sh
