# ==============================================================================
# MacroFlow3D — Par2 RWPT baseline, SF-39 (s225)
# ==============================================================================
#
# Propósito: línea base Par2 RWPT de la comparación de alpha_L (Gate 5) del
# estudio SF-39, en el mismo dominio físico que el estudio lagrangiano
# (decisiones 2026-10-23 D10-D12 y 2026-10-27 F12; preinscripción
# docs/experiments/artifacts/2026-10-27-sf39-macrodispersion-study/preregistration.md,
# secciones 1 y 9). Piloto NR = 20; la extensión hasta N_R se lanza con
# configs/par2_s225_ext.yaml (python3 -m sf39.par2 mkext), tras el presupuesto.
# Copia de apps/config_pipeline_par2_sf38_s225.yaml: solo cambian
# stochastic.seed (9001), analysis.macrodispersion.NR (20) y output.output_dir
# (relativo; el pipeline corre con cwd = $SF39_OUT_ROOT/par2, fuera del espejo).
#
# Dominio: 2496x288x288, dx = 5 -> Lx = 12480; corr_length = 60 (lambda/h = 12);
# dominio 208 x 24 x 24 lambda.
# Gradiente medio de carga J = 100/10240 (la carga oeste escala con Lx:
# 121.875/12480 = 100/10240), K_g = 1 -> velocidad de Darcy nominal K_g J.
# n_steps = ceil(1.2 (Lx - 10 lambda) / (J dt)) con dt = 12.5.
# Campo K: semillas K 9001-9020 (stochastic.seed + r), NR = 20 en un proceso (piloto).
# No se escribe K ni la carga (save_K/save_head false; los defaults del código
# son true). Memoria de dispositivo Par2 ~124.8 B/celda con diagnósticos de
# velocidad apagados.
#
# Uso: cd $SF39_OUT_ROOT/par2 && macroflow3d_pipeline <A>/configs/par2_s225.yaml
# ==============================================================================

# ensemble: ejecuta las NR = analysis.macrodispersion.NR realizaciones en un
# proceso (single_run y ensemble toman el mismo camino: NR = mac.enabled ?
# mac.NR : 1 en EnsembleRunner); se elige ensemble por ser explícito.
run_mode: ensemble

grid:
  nx: 2496
  ny: 288
  nz: 288
  dx: 5.0

# Covarianza gaussiana C(r) = sigma2 exp(-(r/lambda)^2) (decisión 2026-10-07).
stochastic:
  sigma2: 2.25
  corr_length: 60.0
  n_modes: 10000
  covariance_type: 1
  seed: 9001
  K_mean: 1.0

flow:
  solver: mg_cg
  mg_levels: 5
  mg_pre_smooth: 4
  mg_post_smooth: 4
  mg_coarse_iters: 50
  mg_max_cycles: 20
  cg_max_iter: 200
  cg_rtol: 1.0e-6
  cg_check_every: 10
  rtol: 1.0e-6

  pin:
    mode: off   # Dirichlet en west/east -> sistema no singular

  bc:
    west:   { type: dirichlet, value: 121.875 }  # J Lx, J = 100/10240
    east:   { type: dirichlet, value: 0.0 }
    south:  { type: periodic }
    north:  { type: periodic }
    bottom: { type: periodic }
    top:    { type: periodic }

# Advección pura; inyección uniforme en el plano x = 5 lambda sobre todo Y x Z.
transport:
  n_particles: 10000
  dt: 12.5
  n_steps: 116786
  porosity: 1.0
  diffusion: 0.0
  alpha_l: 0.0
  alpha_t: 0.0
  seed: 123456789
  output_every: 389          # ~n_steps/300 (como la base)
  snapshot_every: 0
  inject_x: 300.0              # 5 lambda

analysis:
  macrodispersion:
    enabled: true
    NR: 20
    lambda: 60.0           # = stochastic.corr_length
    vmean_norm: 0.009765625     # J = 100/10240
    sample_every: 10
    var_estimator: biased

  # Snapshots de posiciones (precision 15): se usan para t_b = primer snapshot
  # con alguna partícula en x >= Lx - 5 lambda; cada floor(n_steps/100) pasos.
  snapshots:
    enabled: true
    every: 1167
    legacy_format: true
    include_time: false
    include_status: false
    include_wrap_counts: false
    include_unwrapped: false
    stride: 1
    max_particles: -1
    precision: 15

diagnostics:
  velocity_field: false

output:
  output_dir: raw/par2_s225
  save_K: false
  save_head: false
  save_velocity: false
  save_particles: true
  format: binary
