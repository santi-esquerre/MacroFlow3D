# ==============================================================================
# MacroFlow3D — Par2 (RWPT) small heterogeneous case: byte-compare regression member
# ==============================================================================
# Purpose (scripts/regress): exercises the random-field generator, the heterogeneous
# MG-PCG head solve, the velocity reconstruction and the Par2 transport on a grid that
# runs in seconds on the V100 and locally on a small GPU.  Flow/grid/stochastic blocks
# are those of apps/config_pspta_small.yaml (64x32x32, dx=5, lambda/dx=10, sigma2=1,
# Gaussian covariance); transport is baseline Par2 (purely advective, deterministic seed).
#
#   ./build/macroflow3d_pipeline apps/config_par2_small.yaml
# ==============================================================================

run_mode: single_run

grid:
  nx: 64
  ny: 32
  nz: 32
  dx: 5.0

stochastic:
  sigma2: 1.0
  corr_length: 50.0
  n_modes: 1000
  covariance_type: 1     # Gaussian C(r)=sigma2 exp(-(r/lambda)^2); the only accepted value
  seed: 42
  K_mean: 1.0

flow:
  solver: mg_cg
  mg_levels: 4
  mg_pre_smooth: 4
  mg_post_smooth: 4
  mg_coarse_iters: 50
  mg_max_cycles: 20
  cg_max_iter: 200
  cg_rtol: 1.0e-6
  cg_check_every: 10
  rtol: 1.0e-6

  pin:
    mode: off

  bc:
    west:   { type: dirichlet, value: 100.0 }
    east:   { type: dirichlet, value: 0.0 }
    south:  { type: periodic }
    north:  { type: periodic }
    bottom: { type: periodic }
    top:    { type: periodic }

transport:
  n_particles: 300
  dt: 1.0                # v_mean ~ 0.31 L/T: 400 steps cross ~125 of Lx = 320
  n_steps: 400
  porosity: 1.0
  diffusion: 0.0
  alpha_l: 0.0
  alpha_t: 0.0
  seed: 123456789
  output_every: 20
  snapshot_every: 0
  inject_x: 50.0

analysis:
  macrodispersion:
    enabled: true
    NR: 1
    lambda: 50.0
    vmean_norm: 0.3125   # 100/320
    sample_every: 10
    var_estimator: biased

  snapshots:
    enabled: true
    every: 100
    legacy_format: true
    include_time: false
    include_status: false
    include_wrap_counts: false
    include_unwrapped: false
    stride: 1
    max_particles: -1
    precision: 15

diagnostics:
  velocity_field: true

output:
  output_dir: ./output_par2_small
  save_K: false
  save_head: false
  save_velocity: false
  save_particles: true
  format: binary
